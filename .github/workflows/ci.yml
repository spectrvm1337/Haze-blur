name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --features haze/ffi -- -D warnings
      - run: cargo test --workspace --features haze/ffi

  # The Tauri plugin has to build where the blur does not exist, and do nothing there.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo check --workspace
